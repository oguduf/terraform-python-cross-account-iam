[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-account-iam-lab"
version = "0.1.0"
description = "Offline validation and safe AWS cross-account role assumption helpers"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "bandit>=1.7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

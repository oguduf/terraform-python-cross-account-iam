name: Validation CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: bandit -q -r src
      - run: pytest --cov=cross_account_iam --cov-report=term-missing --cov-fail-under=85
      - name: Offline fixture integration
        run: |
          python -m cross_account_iam.cli validate-config --config config/config.example.yaml
          python -m cross_account_iam.cli validate-policy --trust-policy examples/trust-policy.example.json --source-policy examples/source-policy.example.json --target-policy examples/target-policy.example.json
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=terraform/environments/dev init -backend=false
      - run: terraform -chdir=terraform/environments/dev validate
      - run: terraform -chdir=terraform/environments/stage init -backend=false
      - run: terraform -chdir=terraform/environments/stage validate
      - run: terraform -chdir=terraform/environments/prod init -backend=false
      - run: terraform -chdir=terraform/environments/prod validate
      - name: Install TFLint
        run: curl -sSfL https://raw.githubusercontent.com/terraform-linters/tflint/v0.53.0/install_linux.sh | bash
      - run: tflint --init && tflint --recursive
      - name: Install Checkov
        run: python -m pip install checkov
      - run: checkov -d terraform --framework terraform
      - run: terraform -chdir=terraform/environments/dev test
